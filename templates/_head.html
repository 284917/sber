<meta charset="UTF-8">
<script>
    // Тема до отрисовки страницы, чтобы не мигала: сохранённый выбор или системная настройка
    try { const t = localStorage.getItem('theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}
    function toggleTheme() {
        const root = document.documentElement;
        const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        root.dataset.theme = dark ? 'light' : 'dark';
        try { localStorage.setItem('theme', root.dataset.theme); } catch (e) {}
    }
</script>

<script>
    // PWA: регистрируем service worker и показываем кнопки «Установить», когда браузер готов предложить установку
    if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
    let installPrompt = null;
    addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault(); installPrompt = e;
        document.querySelectorAll('[data-install]').forEach((b) => { b.hidden = false; });
    });
    addEventListener('click', async (e) => {
        const btn = e.target.closest('[data-install]');
        if (!btn || !installPrompt) return;
        installPrompt.prompt();
        await installPrompt.userChoice;
        installPrompt = null;
        document.querySelectorAll('[data-install]').forEach((b) => { b.hidden = true; });
    });
    addEventListener('appinstalled', () => document.querySelectorAll('[data-install]').forEach((b) => { b.hidden = true; }));
</script>
