<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход | Платформа ликвидности Сбер</title>
    <link href="/static/css/app.css" rel="stylesheet">
</head>
<body>
<div class="auth">
    {% include "_auth_side.html" %}
    <main class="auth-main">
        <div class="auth-form">
            <h1>Вход</h1>
            <p class="muted" style="margin: 0 0 24px;">Для заёмщиков, кредиторов и сотрудников платформы</p>
            {% if error %}<div class="note note-bad">{{ error }}</div>{% endif %}
            {% if request.query_params.get('registered') %}
                <div class="note note-ok">Компания зарегистрирована. Войдите и пройдите верификацию.</div>
            {% endif %}
            <form method="post" action="/login">
                <div class="field">
                    <label class="f" for="email">Email</label>
                    <input type="email" name="email" id="email" class="input" autocomplete="username" required>
                </div>
                <div class="field">
                    <label class="f" for="password">Пароль</label>
                    <input type="password" name="password" id="password" class="input" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block" style="margin-top: 8px;">Войти</button>
            </form>
            <p class="muted" style="margin-top: 20px;">Нет аккаунта? <a href="/register">Зарегистрировать компанию</a></p>
        </div>
    </main>
</div>
</body>
</html>
