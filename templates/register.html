<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Регистрация | Платформа ликвидности Сбер</title>
    <link href="/static/css/app.css" rel="stylesheet">
</head>
<body>
<div class="auth">
    {% include "_auth_side.html" %}
    <main class="auth-main">
        <div class="auth-form">
            <h1>Регистрация компании</h1>
            <p class="muted" style="margin: 0 0 20px;">Роль выбирается один раз. После регистрации нужно пройти верификацию (KYC).</p>
            {% if error %}<div class="note note-bad">{{ error }}</div>{% endif %}
            <form method="post" action="/register">
                <div class="seg">
                    <input type="radio" name="role" id="role-borrower" value="borrower" {% if form.role != 'creditor' %}checked{% endif %}>
                    <label for="role-borrower">Заёмщик (РФ)</label>
                    <input type="radio" name="role" id="role-creditor" value="creditor" {% if form.role == 'creditor' %}checked{% endif %}>
                    <label for="role-creditor">Кредитор (зарубежье)</label>
                </div>
                <div class="field">
                    <label class="f" for="company_name">Название компании</label>
                    <input type="text" name="company_name" id="company_name" class="input" maxlength="255" value="{{ form.company_name or '' }}" placeholder="ООО «Альфа»" required>
                </div>
                <div class="form-row field">
                    <div id="country-field">
                        <label class="f" for="country_code">Страна регистрации</label>
                        <select name="country_code" id="country_code" class="input">
                            <option value="">Выберите</option>
                            {% for code, name in creditor_countries.items() %}
                            <option value="{{ code }}" {% if form.country_code == code %}selected{% endif %}>{{ name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="f" for="registration_number" id="regnum-label">ИНН</label>
                        <input type="text" name="registration_number" id="registration_number" class="input" maxlength="50" value="{{ form.registration_number or '' }}" required>
                    </div>
                </div>
                <div class="field">
                    <label class="f" for="email">Email</label>
                    <input type="email" name="email" id="email" class="input" value="{{ form.email or '' }}" autocomplete="username" required>
                </div>
                <div class="field">
                    <label class="f" for="password">Пароль</label>
                    <input type="password" name="password" id="password" class="input" minlength="8" autocomplete="new-password" required>
                    <div class="hint">Не короче 8 символов</div>
                </div>
                <button type="submit" class="btn btn-primary btn-block" style="margin-top: 8px;">Зарегистрироваться</button>
            </form>
            <p class="muted" style="margin-top: 20px;">Уже есть аккаунт? <a href="/">Войти</a></p>
        </div>
    </main>
</div>
<script>
    // Заёмщик — российское юрлицо (ИНН, страна РФ); кредитор — зарубежное (страна и регистрационный номер)
    function syncRole() {
        const creditor = document.getElementById('role-creditor').checked;
        document.getElementById('country-field').style.display = creditor ? '' : 'none';
        document.getElementById('country_code').required = creditor;
        document.getElementById('regnum-label').textContent = creditor ? 'Регистрационный номер' : 'ИНН (10 цифр)';
        const reg = document.getElementById('registration_number');
        reg.placeholder = creditor ? 'HE 123456' : '7700000000';
        if (creditor) { reg.removeAttribute('pattern'); } else { reg.setAttribute('pattern', '\\d{10}'); }
    }
    document.querySelectorAll('input[name=role]').forEach(r => r.addEventListener('change', syncRole));
    syncRole();
</script>
</body>
</html>
