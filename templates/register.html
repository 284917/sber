<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация | Платформа ликвидности Сбер</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; background-color: #EEF3FF; color: #333F48; }
        .sber-card { background: #FFFFFF; border-radius: 20px; border: none; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05); padding: 40px; }
        .btn-sber { background-color: #21A038; color: white; font-weight: 500; border-radius: 12px; padding: 12px; border: none; }
        .btn-sber:hover { background-color: #1a7e2c; color: white; }
        .form-control, .form-select { border-radius: 12px; padding: 12px; border: 1px solid #D1D5DB; background-color: #F9FAFB; }
        .form-control:focus, .form-select:focus { border-color: #21A038; box-shadow: 0 0 0 0.2rem rgba(33, 160, 56, 0.25); }
        .logo-placeholder { font-size: 32px; font-weight: 700; color: #21A038; text-align: center; margin-bottom: 20px; letter-spacing: 2px; }
    </style>
</head>
<body>
<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="col-md-5">
        <div class="sber-card">
            <div class="logo-placeholder">СБЕР</div>
            <h4 class="text-center mb-4" style="font-weight: 500;">Регистрация</h4>
            {% if error %}<div class="alert alert-danger" style="border-radius: 12px;">{{ error }}</div>{% endif %}
            <form method="post" action="/register">
                <div class="mb-3"><input type="email" name="email" class="form-control" placeholder="Email" required></div>
                <div class="mb-3"><input type="password" name="password" class="form-control" placeholder="Пароль" required></div>
                <div class="mb-4">
                    <select name="role" class="form-select" required>
                        <option value="" disabled selected>Выберите роль</option>
                        <option value="borrower">Заемщик (РФ)</option>
                        <option value="creditor">Кредитор (Зарубежье)</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-sber w-100">Зарегистрироваться</button>
            </form>
            <div class="text-center mt-3">
                <a href="/" style="color: #21A038; text-decoration: none;">Уже есть аккаунт? Войти</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
